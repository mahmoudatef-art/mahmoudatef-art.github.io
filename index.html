<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahmoud Atef | Data Scientist</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#020408;--accent:#00f5c3;--accent2:#7c3aed;--accent3:#f59e0b;--text:#e2e8f0;--muted:#64748b;--card:rgba(15,20,30,0.85);--glow:0 0 40px rgba(0,245,195,0.15);}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;cursor:none;}

/* CURSOR */
.cursor{position:fixed;width:12px;height:12px;background:var(--accent);border-radius:50%;pointer-events:none;z-index:9999;box-shadow:0 0 20px var(--accent);transition:transform 0.1s;}
.cursor-ring{position:fixed;width:40px;height:40px;border:1px solid rgba(0,245,195,0.4);border-radius:50%;pointer-events:none;z-index:9998;transition:all 0.15s;}

/* CANVAS */
#bgCanvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;opacity:0.6;}

/* INTRO */
#intro{position:fixed;inset:0;background:#020408;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity 1.2s ease,visibility 1.2s ease;}
#intro.hide{opacity:0;visibility:hidden;pointer-events:none;}
.intro-orb{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(0,245,195,0.07),rgba(124,58,237,0.07) 50%,transparent 70%);animation:orbPulse 3s ease-in-out infinite;pointer-events:none;}
@keyframes orbPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
.intro-hi{font-family:'Space Mono',monospace;font-size:clamp(1rem,2vw,1.3rem);color:var(--accent);letter-spacing:8px;text-transform:uppercase;opacity:0;animation:introUp 0.8s ease 0.4s forwards;margin-bottom:16px;}
.intro-name{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(4rem,12vw,10rem);line-height:0.85;text-align:center;background:linear-gradient(135deg,#fff 0%,var(--accent) 45%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;opacity:0;animation:introUp 0.9s ease 0.9s forwards;}
.intro-name span{display:block;}
.intro-sub{font-family:'Space Mono',monospace;font-size:clamp(0.7rem,1.2vw,0.9rem);color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:28px;opacity:0;animation:introUp 0.7s ease 1.5s forwards;}
.intro-sub em{color:var(--accent3);font-style:normal;}
.intro-divider{width:0;height:1px;background:linear-gradient(90deg,transparent,var(--accent),transparent);margin-top:36px;animation:introLine 1s ease 2s forwards;}
@keyframes introLine{to{width:220px;}}
.intro-bar{position:absolute;bottom:0;left:0;right:0;height:2px;background:rgba(0,245,195,0.06);}
.intro-bar-fill{height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));animation:introBarFill 5s linear forwards;}
@keyframes introBarFill{from{width:0}to{width:100%}}
@keyframes introUp{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:translateY(0)}}

/* NAV */
nav{position:fixed;top:0;left:0;right:0;z-index:100;padding:20px 60px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(180deg,rgba(2,4,8,0.9),transparent);backdrop-filter:blur(10px);}
.nav-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.3rem;color:var(--accent);letter-spacing:2px;}
.nav-links{display:flex;gap:40px;list-style:none;}
.nav-links a{color:var(--muted);text-decoration:none;font-size:0.85rem;letter-spacing:2px;text-transform:uppercase;transition:color 0.3s;font-family:'Space Mono',monospace;}
.nav-links a:hover{color:var(--accent);}

/* HERO */
#hero{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:0 10% 0 12%;overflow:hidden;}
.shape{position:absolute;border-radius:50%;filter:blur(60px);pointer-events:none;}
.shape-1{width:400px;height:400px;right:-100px;top:10%;background:radial-gradient(circle,rgba(124,58,237,0.3),transparent);animation:float1 8s ease-in-out infinite;}
.shape-2{width:300px;height:300px;right:15%;bottom:20%;background:radial-gradient(circle,rgba(0,245,195,0.15),transparent);animation:float2 10s ease-in-out infinite;}
@keyframes float1{0%,100%{transform:translateY(0)}50%{transform:translateY(-30px)}}
@keyframes float2{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(20px) scale(1.1)}}
.hero-tag{font-family:'Space Mono',monospace;font-size:0.8rem;color:var(--accent);letter-spacing:4px;margin-bottom:24px;display:flex;align-items:center;gap:12px;opacity:0;animation:fadeUp 0.8s ease 0.3s forwards;}
.hero-tag::before{content:'';display:block;width:40px;height:1px;background:var(--accent);}
.hero-name{font-family:'Syne',sans-serif;font-size:clamp(3.5rem,9vw,9rem);font-weight:800;line-height:0.9;opacity:0;animation:fadeUp 0.8s ease 0.5s forwards;}
.hero-name span{display:block;background:linear-gradient(135deg,#fff 0%,var(--accent) 50%,var(--accent2) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-role{font-family:'Space Mono',monospace;font-size:clamp(1rem,2vw,1.4rem);color:var(--muted);margin-top:24px;opacity:0;animation:fadeUp 0.8s ease 0.7s forwards;}
.hero-role em{color:var(--accent3);font-style:normal;}
.hero-desc{max-width:500px;margin-top:20px;font-size:1rem;color:var(--muted);line-height:1.8;opacity:0;animation:fadeUp 0.8s ease 0.9s forwards;}
.hero-cta{display:flex;gap:16px;margin-top:40px;flex-wrap:wrap;opacity:0;animation:fadeUp 0.8s ease 1.1s forwards;}
@keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
.hero-scroll{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);opacity:0;animation:fadeUp 0.8s ease 1.3s forwards;}
.scroll-line{width:1px;height:60px;background:linear-gradient(180deg,var(--accent),transparent);animation:scrollAnim 2s infinite;}
@keyframes scrollAnim{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(20px)}}

/* BUTTONS */
.btn-primary{padding:14px 32px;background:var(--accent);color:#020408;font-weight:700;font-family:'Syne',sans-serif;border:none;border-radius:2px;cursor:none;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s;text-decoration:none;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
.btn-primary:hover{background:#020408;color:var(--accent);box-shadow:0 0 30px rgba(0,245,195,0.3);}
.btn-whatsapp{padding:14px 28px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:700;font-family:'Syne',sans-serif;border:none;border-radius:2px;cursor:none;font-size:0.9rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.3s;text-decoration:none;display:inline-flex;align-items:center;gap:10px;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
.btn-whatsapp:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(37,211,102,0.35);}
.btn-outline{padding:14px 32px;background:transparent;color:var(--text);font-weight:500;font-family:'Syne',sans-serif;border:1px solid rgba(255,255,255,0.15);border-radius:2px;cursor:none;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s;text-decoration:none;}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);}

/* SECTIONS */
section{position:relative;z-index:1;}

/* ABOUT */
#about{padding:120px 12%;display:grid;grid-template-columns:1.2fr 260px 1fr;gap:48px;align-items:center;}
.section-label{font-family:'Space Mono',monospace;font-size:0.75rem;color:var(--accent);letter-spacing:4px;text-transform:uppercase;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.section-label::before{content:'';display:block;width:30px;height:1px;background:var(--accent);}
.section-title{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2rem,4vw,3.5rem);line-height:1;margin-bottom:24px;}
.section-divider{width:60px;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));margin:20px 0 28px;}
.about-text{font-size:0.98rem;color:var(--muted);line-height:1.9;margin-bottom:14px;}
.about-text strong{color:var(--accent);}
.about-stats{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:28px;}
.stat-card{background:var(--card);border:1px solid rgba(0,245,195,0.1);padding:18px;border-radius:4px;transition:all 0.3s;}
.stat-card:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-4px);}
.stat-num{font-family:'Syne',sans-serif;font-size:2rem;font-weight:800;color:var(--accent);}
.stat-label{font-size:0.75rem;color:var(--muted);margin-top:4px;}

/* PHOTO */
.about-photo{display:flex;align-items:center;justify-content:center;}
.photo-wrapper{position:relative;width:240px;height:240px;}
.photo-ring{position:absolute;inset:-4px;border-radius:50%;background:conic-gradient(var(--accent),var(--accent2),var(--accent3),var(--accent));animation:spinRing 4s linear infinite;}
@keyframes spinRing{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.photo-ring-inner{position:absolute;inset:3px;border-radius:50%;background:var(--bg);}
.photo-img{position:absolute;inset:6px;border-radius:50%;object-fit:cover;width:calc(100% - 12px);height:calc(100% - 12px);z-index:2;}
.photo-glow{position:absolute;inset:-30px;border-radius:50%;background:radial-gradient(circle,rgba(0,245,195,0.1),transparent 70%);animation:float2 6s ease-in-out infinite;}

/* ABOUT CARD */
.about-card{background:var(--card);border:1px solid rgba(0,245,195,0.1);border-radius:8px;padding:28px;box-shadow:20px 20px 40px rgba(0,0,0,0.5),var(--glow);transition:transform 0.5s;}
.about-card:hover{transform:perspective(800px) rotateY(-3deg);}
.edu-badge{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;padding:14px;background:rgba(0,245,195,0.05);border-radius:4px;border-left:3px solid var(--accent);}
.passion-badge{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px;padding:14px;background:rgba(124,58,237,0.05);border-radius:4px;border-left:3px solid var(--accent2);}
.ai-badge{display:flex;align-items:flex-start;gap:14px;padding:14px;background:rgba(245,158,11,0.05);border-radius:4px;border-left:3px solid var(--accent3);}
.badge-icon{font-size:1.6rem;flex-shrink:0;}
.badge-info h4{font-family:'Syne',sans-serif;font-weight:700;font-size:0.95rem;}
.badge-info p{font-size:0.78rem;color:var(--muted);margin-top:3px;}

/* TOOLS */
#tools{padding:100px 12%;}
.section-header{margin-bottom:56px;}
.tools-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
.tool-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);cursor:none;position:relative;overflow:hidden;}
.tool-card::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(0,245,195,0.08),transparent 70%);opacity:0;transition:opacity 0.3s;}
.tool-card:hover::before{opacity:1;}
.tool-card:hover{transform:translateY(-10px) scale(1.02);border-color:rgba(0,245,195,0.3);box-shadow:0 20px 40px rgba(0,0,0,0.3),var(--glow);}
.tool-logo{width:54px;height:54px;display:flex;align-items:center;justify-content:center;border-radius:12px;background:rgba(255,255,255,0.04);}
.tool-logo img{width:100%;height:100%;object-fit:contain;}
.tool-name{font-family:'Syne',sans-serif;font-weight:700;font-size:0.86rem;text-align:center;}
.tool-type{font-size:0.66rem;color:var(--muted);text-align:center;letter-spacing:1px;text-transform:uppercase;}
.tool-level{width:100%;height:2px;background:rgba(255,255,255,0.06);border-radius:2px;overflow:hidden;}
.tool-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:2px;width:0;transition:width 1.5s ease;}

/* LIBRARIES */
#libraries{padding:0 12% 100px;}
.lib-grid{display:flex;flex-wrap:wrap;gap:10px;margin-top:36px;}
.lib-tag{padding:8px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);border-radius:100px;font-size:0.82rem;color:var(--text);font-family:'Space Mono',monospace;transition:all 0.3s;cursor:none;display:flex;align-items:center;gap:7px;}
.lib-tag:hover{background:rgba(0,245,195,0.1);border-color:var(--accent);color:var(--accent);transform:translateY(-2px);}
.lib-dot{width:5px;height:5px;border-radius:50%;background:var(--accent);flex-shrink:0;}

/* PROJECTS */
#projects{padding:100px 12%;}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px;margin-top:52px;}
.project-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:30px;transition:all 0.4s;cursor:none;position:relative;overflow:hidden;display:flex;flex-direction:column;gap:14px;}
.project-card::after{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2));transform:scaleX(0);transform-origin:left;transition:transform 0.4s;}
.project-card:hover::after{transform:scaleX(1);}
.project-card:hover{transform:translateY(-8px);border-color:rgba(0,245,195,0.15);box-shadow:0 30px 60px rgba(0,0,0,0.3);}
.project-num{font-family:'Space Mono',monospace;font-size:0.68rem;color:var(--muted);letter-spacing:2px;}
.project-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1.1rem;line-height:1.3;}
.project-desc{font-size:0.86rem;color:var(--muted);line-height:1.8;flex:1;}
.project-tags{display:flex;flex-wrap:wrap;gap:6px;}
.project-tag{padding:3px 10px;background:rgba(0,245,195,0.08);border:1px solid rgba(0,245,195,0.15);border-radius:100px;font-size:0.68rem;color:var(--accent);font-family:'Space Mono',monospace;}
.project-link{display:flex;align-items:center;gap:8px;color:var(--text);text-decoration:none;font-size:0.82rem;transition:color 0.3s;margin-top:4px;}
.project-link:hover{color:var(--accent);}
.project-arrow{width:22px;height:22px;border-radius:50%;background:rgba(0,245,195,0.1);display:flex;align-items:center;justify-content:center;font-size:0.7rem;transition:all 0.3s;}
.project-link:hover .project-arrow{background:var(--accent);color:#020408;transform:rotate(45deg);}

/* CONTACT */
#contact{padding:100px 12%;display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:start;}
.contact-line{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(2.5rem,5vw,5rem);line-height:0.9;margin-bottom:20px;}
.contact-line span{color:var(--accent);}
.contact-sub{font-size:0.98rem;color:var(--muted);line-height:1.8;max-width:400px;}
.contact-wa-btn{margin-top:28px;display:inline-flex;align-items:center;gap:12px;padding:16px 36px;background:linear-gradient(135deg,#25D366,#128C7E);color:#fff;font-weight:700;font-family:'Syne',sans-serif;border-radius:2px;cursor:none;font-size:1rem;letter-spacing:1px;text-transform:uppercase;transition:all 0.3s;text-decoration:none;clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px));}
.contact-wa-btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(37,211,102,0.4);}
.social-links{display:flex;gap:10px;margin-top:28px;flex-wrap:wrap;}
.social-link{display:flex;align-items:center;gap:8px;padding:11px 18px;background:var(--card);border:1px solid rgba(255,255,255,0.08);border-radius:4px;text-decoration:none;color:var(--text);font-size:0.8rem;font-family:'Space Mono',monospace;transition:all 0.3s;cursor:none;}
.social-link:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-3px);box-shadow:var(--glow);}
.contact-info-card{background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:32px;}
.contact-item{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,0.06);}
.contact-item:last-child{border-bottom:none;}
.ci-icon{width:40px;height:40px;background:rgba(0,245,195,0.08);border:1px solid rgba(0,245,195,0.15);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:1rem;flex-shrink:0;}
.ci-text label{display:block;font-size:0.66rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px;font-family:'Space Mono',monospace;}
.ci-text a,.ci-text span{font-size:0.86rem;color:var(--text);text-decoration:none;transition:color 0.3s;}
.ci-text a:hover{color:var(--accent);}

/* MESSAGE FORM */
.msg-form{margin-top:20px;background:var(--card);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:32px;display:flex;flex-direction:column;gap:16px;}
.msg-form-title{font-family:'Syne',sans-serif;font-weight:700;font-size:1rem;display:flex;align-items:center;gap:10px;margin-bottom:4px;}
.msg-form-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent);}
.msg-label{display:block;font-size:0.68rem;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px;font-family:'Space Mono',monospace;}
.msg-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.1);border-radius:4px;padding:12px 16px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:0.9rem;outline:none;transition:border-color 0.3s;}
.msg-input:focus{border-color:var(--accent);box-shadow:0 0 0 2px rgba(0,245,195,0.1);}
.msg-input::placeholder{color:var(--muted);}
.msg-textarea{resize:vertical;min-height:110px;}
.msg-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 28px;background:var(--accent);color:#020408;font-weight:700;font-family:'Syne',sans-serif;border:none;border-radius:2px;cursor:pointer;font-size:0.9rem;letter-spacing:2px;text-transform:uppercase;transition:all 0.3s;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px));}
.msg-btn:hover{background:#020408;color:var(--accent);box-shadow:0 0 24px rgba(0,245,195,0.3);}
.msg-success{display:none;padding:12px 16px;background:rgba(0,245,195,0.1);border:1px solid rgba(0,245,195,0.3);border-radius:4px;color:var(--accent);font-size:0.85rem;font-family:'Space Mono',monospace;text-align:center;}
.msg-success.show{display:block;animation:fadeUp 0.5s ease forwards;}

/* FOOTER */
footer{padding:32px 12%;border-top:1px solid rgba(255,255,255,0.06);display:flex;justify-content:space-between;align-items:center;position:relative;z-index:1;}
.footer-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:1.2rem;color:var(--accent);}
.footer-copy{font-size:0.75rem;color:var(--muted);font-family:'Space Mono',monospace;}

/* REVEAL */
.reveal{opacity:0;transform:translateY(40px);transition:all 0.8s cubic-bezier(0.16,1,0.3,1);}
.reveal.visible{opacity:1;transform:translateY(0);}

@media(max-width:900px){
  nav{padding:16px 24px;}
  .nav-links{display:none;}
  #hero{padding:0 6%;}
  #about{grid-template-columns:1fr;padding:80px 6%;text-align:center;}
  .about-photo{order:-1;}
  .section-label::before{display:none;}
  #tools{padding:80px 6%;}
  #libraries{padding:0 6% 80px;}
  #projects{padding:80px 6%;}
  .projects-grid{grid-template-columns:1fr;}
  #contact{grid-template-columns:1fr;padding:80px 6%;}
  footer{flex-direction:column;gap:12px;padding:24px 6%;}
}
</style>
</head>
<body>

<div class="cursor" id="cursor"></div>
<div class="cursor-ring" id="cursorRing"></div>

<!-- INTRO -->
<div id="intro">
  <div class="intro-orb"></div>
  <div class="intro-hi">Hi, I'm</div>
  <div class="intro-name">
    <span>Mahmoud</span>
    <span>Atef</span>
  </div>
  <div class="intro-sub">Data Scientist &nbsp;&middot;&nbsp; <em>ML Engineer</em> &nbsp;&middot;&nbsp; Egypt</div>
  <div class="intro-divider"></div>
  <div class="intro-bar">
    <div class="intro-bar-fill"></div>
  </div>
</div>

<canvas id="bgCanvas"></canvas>

<nav>
  <div class="nav-logo
